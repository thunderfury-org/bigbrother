[workspace]
resolver = "3"
members = ["app"]
default-members = ["app"]

[profile.release]
lto = true
codegen-units = 1

[workspace.dependencies]
axum = "0.8"
tower = "0"
tower-http = { version = "0.6", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["time", "local-time"] }
tracing-appender = "0.2"
trace_id = { version = "0.1.1", features = ["axum"] }
backtrace = "0.3"
clap = { version = "4.5", features = ["derive"] }
time = { version = "0.3", features = ["serde"] }
reqwest = { version = "0.12", features = [
  "rustls-tls",
  "json",
  "gzip",
  "deflate",
  "brotli",
], default-features = false }
reqwest-middleware = "0.4"
reqwest-retry = "0.7"
thiserror = "2"
regex = "1"
lingua = { version = "1.7.2", default-features = false, features = [
  "english",
  "chinese",
  "japanese",
] }
teloxide = { version = "0.17.0", default-features = false, features = [
  "ctrlc_handler",
  "rustls",
  "macros",
] }
futures = "0.3"
sea-orm = { version = "2.0.0-rc", features = [
  "sqlx-sqlite",
  "runtime-tokio-rustls",
  "macros",
] }
