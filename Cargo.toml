[package]
name = "bigbrother"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = true
codegen-units = 1

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "time",
  "local-time",
] }
tracing-appender = "0.2"
backtrace = "0.3"
clap = { version = "4.5", features = ["derive"] }
time = { version = "0.3", features = ["serde"] }
reqwest = { version = "0.12", features = [
  "rustls-tls",
  "json",
  "gzip",
  "deflate",
], default-features = false }
thiserror = "2"
regex = "1"
lingua = { version = "1.7.2", default-features = false, features = [
  "english",
  "chinese",
  "japanese",
] }
teloxide = { version = "0.17.0", default-features = false, features = [
  "ctrlc_handler",
  "rustls",
  "macros",
] }
futures = "0.3"
