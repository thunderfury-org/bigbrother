<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>导入历史</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px 32px;
        background: #f5f6f8;
        color: #1c1f23;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      .filters {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        padding: 12px 16px;
        background: #ffffff;
        border: 1px solid #e3e5e8;
        border-radius: 6px;
        margin-bottom: 16px;
      }
      .filters label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
      }
      select,
      input,
      button {
        font-size: 13px;
        padding: 4px 8px;
        border: 1px solid #cdd1d6;
        border-radius: 4px;
        background: #ffffff;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #ffffff;
        border-radius: 6px;
        overflow: hidden;
      }
      thead {
        background: #eef0f3;
        text-align: left;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      th,
      td {
        padding: 10px 14px;
        border-bottom: 1px solid #edf0f3;
        font-size: 13px;
      }
      tr:hover {
        background: #f6f8fb;
      }
      .source-cell {
        max-width: 380px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .source-cell a {
        color: #1a73e8;
        text-decoration: none;
      }
      .source-cell a:hover {
        text-decoration: underline;
      }
      .status {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 12px;
      }
      .status-running {
        background: #d6e7ff;
        color: #003d80;
      }
      .status-succeeded {
        background: #d8f3df;
        color: #1f5128;
      }
      .status-partially_failed {
        background: #fff0c7;
        color: #6d4f00;
      }
      .status-failed {
        background: #ffd6d6;
        color: #7a0d0d;
      }
      .status-skipped {
        background: #e6e9ec;
        color: #4a4f56;
      }
      .pagination {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 12px;
        font-size: 13px;
      }
      .detail {
        margin-top: 16px;
        padding: 16px 18px;
        background: #ffffff;
        border: 1px solid #e3e5e8;
        border-radius: 6px;
      }
      .detail h2 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      pre {
        background: rgba(0, 0, 0, 0.04);
        padding: 10px;
        border-radius: 4px;
        max-height: 360px;
        overflow: auto;
        font-size: 12px;
      }
      .empty {
        padding: 24px;
        text-align: center;
        color: #6e7480;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>导入历史</h1>
      <span id="meta"></span>
    </header>

    <form class="filters" id="filters">
      <label>
        状态
        <select name="status">
          <option value="">全部</option>
          <option value="running">Running</option>
          <option value="succeeded">Succeeded</option>
          <option value="partially_failed">Partially failed</option>
          <option value="failed">Failed</option>
          <option value="skipped">Skipped</option>
        </select>
      </label>
      <label>
        来源
        <select name="source_kind">
          <option value="">全部</option>
          <option value="quark">Quark</option>
          <option value="pan123">Pan123</option>
          <option value="pan189">Pan189</option>
          <option value="pan115">Pan115</option>
          <option value="telegram">Telegram</option>
          <option value="other">Other</option>
        </select>
      </label>
      <label>
        从
        <input type="datetime-local" name="since" />
      </label>
      <label>
        到
        <input type="datetime-local" name="until" />
      </label>
      <button type="submit">应用</button>
      <button type="button" id="reset">重置</button>
    </form>

    <table id="records">
      <thead>
        <tr>
          <th>ID</th>
          <th>来源</th>
          <th>链接</th>
          <th>标题</th>
          <th>季集</th>
          <th>状态</th>
          <th>耗时</th>
          <th>开始</th>
          <th>结束</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="empty" id="empty" hidden>没有匹配的导入记录</div>

    <div class="pagination">
      <span id="page-info"></span>
      <span>
        <button type="button" id="prev" disabled>上一页</button>
        <button type="button" id="next" disabled>下一页</button>
      </span>
    </div>

    <section class="detail" id="detail" hidden>
      <h2>详情 <small id="detail-id"></small></h2>
      <pre id="detail-body"></pre>
    </section>

    <script>
      const cursorStack = [];
      let nextCursor = null;
      let currentParams = new URLSearchParams();

      const filtersForm = document.getElementById("filters");
      const tableBody = document.querySelector("#records tbody");
      const emptyEl = document.getElementById("empty");
      const detailEl = document.getElementById("detail");
      const detailBody = document.getElementById("detail-body");
      const detailIdEl = document.getElementById("detail-id");
      const prevBtn = document.getElementById("prev");
      const nextBtn = document.getElementById("next");
      const pageInfo = document.getElementById("page-info");

      function paramsFromForm() {
        const data = new FormData(filtersForm);
        const params = new URLSearchParams();
        for (const [key, value] of data.entries()) {
          if (!value) continue;
          if (key === "since" || key === "until") {
            params.set(key, new Date(value).toISOString());
          } else {
            params.set(key, value);
          }
        }
        return params;
      }

      function formatTimestamp(value) {
        if (!value) return "—";
        const d = new Date(value);
        if (Number.isNaN(d.getTime())) return value;
        return d.toLocaleString();
      }

      function formatCost(ms) {
        if (!ms) return "—";
        if (ms < 1000) return `${ms}ms`;
        return `${(ms / 1000).toFixed(1)}s`;
      }

      function renderRow(item) {
        const tr = document.createElement("tr");
        tr.dataset.id = item.id;
        const title = item.year ? `${item.title} (${item.year})` : (item.title || "—");
        const seasonEp = item.season != null
          ? `S${String(item.season).padStart(2, "0")} ${item.episode_summary || ""}`.trim()
          : (item.episode_summary || "—");
        const sourceLink = item.source.startsWith("http")
          ? `<a href="${item.source}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${item.source}</a>`
          : item.source;
        tr.innerHTML = `
          <td>${item.id}</td>
          <td>${item.source_kind}</td>
          <td class="source-cell" title="${item.source}">${sourceLink}</td>
          <td>${title}</td>
          <td>${seasonEp}</td>
          <td><span class="status status-${item.status}">${item.status}</span></td>
          <td>${formatCost(item.cost_ms)}</td>
          <td>${formatTimestamp(item.created_at)}</td>
          <td>${formatTimestamp(item.finished_at)}</td>
        `;
        tr.addEventListener("click", () => openDetail(item.id));
        return tr;
      }

      async function load(params, useCursor) {
        if (useCursor != null) {
          params.set("cursor", String(useCursor));
        }
        const response = await fetch(`/api/imports?${params.toString()}`);
        if (!response.ok) {
          alert(`加载失败: ${response.status} ${await response.text()}`);
          return;
        }
        const data = await response.json();
        tableBody.innerHTML = "";
        for (const item of data.items) {
          tableBody.appendChild(renderRow(item));
        }
        emptyEl.hidden = data.items.length > 0;
        nextCursor = data.next_cursor;
        nextBtn.disabled = nextCursor == null;
        prevBtn.disabled = cursorStack.length === 0;
        pageInfo.textContent = `共 ${data.items.length} 条`;
      }

      async function openDetail(id) {
        const response = await fetch(`/api/imports/${id}`);
        if (!response.ok) {
          alert(`加载详情失败: ${response.status}`);
          return;
        }
        const data = await response.json();
        detailEl.hidden = false;
        detailIdEl.textContent = `#${id}`;
        detailBody.textContent = JSON.stringify(data, null, 2);
        detailEl.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      filtersForm.addEventListener("submit", (event) => {
        event.preventDefault();
        cursorStack.length = 0;
        currentParams = paramsFromForm();
        load(new URLSearchParams(currentParams), null);
      });

      document.getElementById("reset").addEventListener("click", () => {
        filtersForm.reset();
        cursorStack.length = 0;
        currentParams = new URLSearchParams();
        load(new URLSearchParams(), null);
      });

      nextBtn.addEventListener("click", () => {
        if (nextCursor == null) return;
        cursorStack.push(nextCursor);
        load(new URLSearchParams(currentParams), nextCursor);
      });

      prevBtn.addEventListener("click", () => {
        cursorStack.pop();
        const back = cursorStack[cursorStack.length - 1] ?? null;
        load(new URLSearchParams(currentParams), back);
      });

      load(new URLSearchParams(), null);
    </script>
  </body>
</html>
