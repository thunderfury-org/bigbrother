# git-cliff configuration for bigbrother
# https://git-cliff.org/docs/configuration

[changelog]
header = "# Changelog\n"
body = """
{%- if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
## [Unreleased]
{%- endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}({{ commit.scope }}) {% endif %}{{ commit.message }}
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { message = "^feat", group = "Features", default_scope = "app" },
    { message = "^fix", group = "Bug Fixes", default_scope = "app" },
    { message = "^refactor", group = "Refactoring", default_scope = "app" },
    { message = "^docs", group = "Documentation", default_scope = "app" },
    { message = "^test", group = "Testing", default_scope = "app" },
    { message = "^chore", group = "Chores", default_scope = "app" },
    { message = "^perf", group = "Performance", default_scope = "app" },
    { message = "^ci", group = "CI/CD", default_scope = "app" },
    { message = "^style", group = "Styling", default_scope = "app" },
    { message = "^support", group = "Support", default_scope = "app" },
]
protect_breaking_commit_desc = true
filter_commits = false
tag_pattern = "v?[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "newest"
